name: Release

# Push a tag that matches the version in manifest.json (e.g. 0.5.0) to publish a release
# with the three files Obsidian (and BRAT) need.
on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: npm test
      - name: Check tag matches manifest version
        run: |
          v=$(node -p "require('./manifest.json').version")
          if [ "$v" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} != manifest version $v"; exit 1; fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" --generate-notes
